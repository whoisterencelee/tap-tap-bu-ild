<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1000 667" 
     preserveAspectRatio="none">
  
  <!-- Background -->
  <rect x="0" y="0" width="1000" height="667" fill="#F9F6F0" rx="10"/>

  <!-- Top Header Box -->
  <rect x="20" y="25" width="960" height="85" fill="none" stroke="#CBB495" stroke-width="1" rx="5" vector-effect="non-scaling-stroke"/>
  <text x="35" y="45" font-family="Arial, sans-serif" font-size="1em" textLength="18em" lengthAdjust="spacingAndGlyphs" font-weight="bold" fill="#1A2B3C">PROJECT ORGANIZER</text>

  <!-- PARTS LIST -->
  <rect x="20" y="120" width="280" height="525" fill="#4A6577" rx="6" vector-effect="non-scaling-stroke"/>
  <text x="45" y="140" font-family="Arial, sans-serif" textLength="11em" lengthAdjust="spacingAndGlyphs" font-weight="bold" fill="#FFFFFF">PARTS LIST</text>

  <!-- SCHEMATICS -->
  <rect x="320" y="120" width="320" height="260" fill="#FDFBF7" stroke="#97A9B5" stroke-width="1" rx="6" vector-effect="non-scaling-stroke"/>
  <text x="480" y="140" font-family="Arial, sans-serif" font-size="1em" textLength="11em" lengthAdjust="spacingAndGlyphs" font-weight="bold" fill="#1A2B3C" text-anchor="middle">SCHEMATICS</text>

  <!-- TASKS -->
  <rect x="660" y="120" width="320" height="525" fill="#CBB495" rx="6" vector-effect="non-scaling-stroke"/>
  <text x="680" y="140" font-family="Arial, sans-serif" font-size="1em" textLength="6em" lengthAdjust="spacingAndGlyphs" font-weight="bold" fill="#1A2B3C">TASKS</text>
  <line x1="680" y1="390" x2="970" y2="390" stroke="#4A6577" stroke-width="1" vector-effect="non-scaling-stroke"/>

  <!-- NOTES -->
  <rect x="320" y="395" width="320" height="250" fill="#FDFBF7" stroke="#97A9B5" stroke-width="1" rx="6" vector-effect="non-scaling-stroke"/>
  <text x="480" y="416" font-family="Arial, sans-serif" font-size="1em" textLength="6em" lengthAdjust="spacingAndGlyphs" font-weight="bold" fill="#A2B3C" text-anchor="middle">NOTES</text>

</svg>
